version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 3
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - "@chromatic-com/storybook"
          - storybook
          - storybook-next-intl
      react:
        patterns:
          - react
          - react-dom
